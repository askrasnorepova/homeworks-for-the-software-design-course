<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>История транзакций</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  h2 {
    margin-bottom: 15px;
  }
  .transactions-container {
    margin-top: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }
  th {
    background-color: #f2f2f2;
  }
  #noTransactions {
    font-style: italic;
    color: #555;
  }
</style>
</head>
<body>

<h2>История транзакций</h2>

<div class="transactions-container" id="transactionsContainer">
  <!-- Тут будет таблица или сообщение -->
</div>

<script>
  // Массив транзакций. Заполните откуда нужно
  const transactions = [
    // Пример:
    /*{
      time: '2023-10-20 14:35',
      type: 'Оплата',
      amount: '50 ₽',
      requestLink: 'https://example.com/request/123'
    }*/
  ];

  const container = document.getElementById('transactionsContainer');

  if (transactions.length === 0) {
    // Если транзакций нет — выводим сообщение
    container.innerHTML = '<div id="noTransactions">Нет транзакций</div>';
  } else {
    // Создаем таблицу
    const table = document.createElement('table');

    // Заголовки
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    ['Время транзакции', 'Тип транзакции', 'Сумма транзакции', 'Ссылка на запрос'].forEach(title => {
      const th = document.createElement('th');
      th.textContent = title;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Тело таблицы
    const tbody = document.createElement('tbody');
    transactions.forEach(tx => {
      const row = document.createElement('tr');

      const timeCell = document.createElement('td');
      timeCell.textContent = tx.time;
      row.appendChild(timeCell);

      const typeCell = document.createElement('td');
      typeCell.textContent = tx.type;
      row.appendChild(typeCell);

      const amountCell = document.createElement('td');
      amountCell.textContent = tx.amount;
      row.appendChild(amountCell);

      const linkCell = document.createElement('td');
      if (tx.requestLink) {
        const link = document.createElement('a');
        link.href = tx.requestLink;
        link.textContent = 'Посмотреть';
        link.target = '_blank';
        linkCell.appendChild(link);
      } else {
        linkCell.textContent = 'Нет ссылки';
      }
      row.appendChild(linkCell);

      tbody.appendChild(row);
    });

    table.appendChild(tbody);
    container.appendChild(table);
  }
</script>

</body>
</html>

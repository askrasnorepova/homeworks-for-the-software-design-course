<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Информация о пользователе</title>
<style>
  /* Общие стили для страницы */
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  /* Блок с информацией о пользователе */
  #userInfo {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 200px;
    background-color: #f9f9f9;
    border: 1px solid #ccc;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  #userInfo h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
    text-align: center;
  }

  #userInfo p {
    margin: 5px 0;
  }
</style>
</head>
<body>

<!-- Блок с информацией о пользователе -->
<div id="userInfo">
  <h3>Пользователь</h3>
  <p><strong>ID:</strong> <span id="userId">12345</span></p>
  <p><strong>E-mail:</strong> <span id="userEmail">user@example.com</span></p>
  <p><strong>Баланс:</strong> <span id="userBalance">1000 ₽</span></p>
</div>

</body>
</html>
